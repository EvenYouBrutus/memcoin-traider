[package]
name = "graduation_sniper_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
solana-sdk = "2.1"
solana-client = "2.1"
solana-transaction-status = "2.1"
anchor-client = "2.0.0-rc.1"
yellowstone-grpc-client = "13.5.1"
jito-sdk = "0.3.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.18"
dashmap = "5.5"
rayon = "1.9"
chrono = "0.4"
arrayvec = "0.7"
futures = "0.3"
thiserror = "1.0"